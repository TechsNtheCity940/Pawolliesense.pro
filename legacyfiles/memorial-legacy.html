<section class="hero small">
  <h1>Memorial Wall</h1>
  <p>A living space of remembrance</p>

<section class="booking">
  <form name="memorial-post" method="POST" data-netlify="true" enctype="multipart/form-data">

    <input type="file" name="photo" required>
